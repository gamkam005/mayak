name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o bin/mayak ./cmd/mayak
          go build -trimpath -o bin/tspusim ./cmd/tspusim
          ./bin/mayak version
