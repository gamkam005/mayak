<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>МАЯК — вход</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#e6ebf7;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{background:#141d36;border:1px solid #24304f;border-radius:14px;padding:24px;width:min(340px,90vw)}
h1{font-size:20px;margin:0 0 4px}p{color:#8a96b3;margin:0 0 16px;font-size:13px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid #24304f;background:#0b1020;color:#e6ebf7;font:inherit}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:#ffb83d;color:#1a1300;font:inherit;font-weight:700;cursor:pointer}
#e{color:#ff5d73;font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f" autocomplete="on">
 <h1>🗼 МАЯК</h1><p>Панель управления. Пароль — в файле <code>ui.pass</code> (на MikroTik: Files → mayak-data/ui.pass).</p>
 <input type="password" id="p" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
 <button type="submit">Войти</button>
 <div id="e"></div>
</form>
<script>
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='';
 try{const r=await fetch('/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});
 const j=await r.json().catch(()=>({}));if(r.ok&&j.ok){location='/panel';return}e.textContent=j.err||('ошибка '+r.status)}catch(x){e.textContent='нет связи с МАЯК'}};
</script></body></html>
